<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주문하기</title>
<meta property="og:title" content="주문하기">
<meta property="og:description" content="이름을 고르고 원하는 메뉴를 선택해 주세요.">

<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">

<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar"></header>
    <main id="main" class="main" role="main"></main>

    <div class="sheet-backdrop" data-act="sheet-close"></div>

  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="menus.js?v=1.1.14"></script>
